<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Розклад руху автобусів</title>
</head>
<body>
  <h1>Розклад руху автобусів</h1>

  <table border="1">
    <caption>Розклад рейсів</caption>
    <thead>
      <tr>
        <th>Маршрут</th>
        <th>Місце відправлення</th>
        <th>Місце прибуття</th>
        <th colspan="2">Час</th>
      </tr>
      <tr>
        <th></th>
        <th></th>
        <th></th>
        <th>Відправлення</th>
        <th>Прибуття</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">№1</td>
        <td rowspan="2">Луцьк</td>
        <td rowspan="2">Київ</td>
        <td>08:00</td>
        <td>13:00</td>
      </tr>
      <tr>
        <td>15:00</td>
        <td>20:00</td>
      </tr>
      <tr>
        <td rowspan="2">№2</td>
        <td rowspan="2">Львів</td>
        <td rowspan="2">Одеса</td>
        <td>07:30</td>
        <td>16:00</td>
      </tr>
      <tr>
        <td>18:00</td>
        <td>02:00</td>
      </tr>
      <tr>
        <td>№3</td>
        <td>Харків</td>
        <td>Дніпро</td>
        <td>09:00</td>
        <td>12:00</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5">Всього рейсів: 5</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
